name: Fork release

on:
  push:
    tags: ["v*-hz.*"]

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'hzcheng/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: tag
        name: Validate release tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hz\.[1-9][0-9]*$ ]] || exit 1
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  linux_cli:
    name: Linux service (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Configure public Connect defaults
        run: cp .env.example .env
      - name: Align package versions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Build server and web client
        run: vp run --filter t3 build
      - name: Build CLI executable
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build resource monitor
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "apps/server/dist/resource-monitor/linux-$ARCH"
          cp native/resource-monitor/target/release/t3-resource-monitor "apps/server/dist/resource-monitor/linux-$ARCH/"
      - name: Install archive dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf libatomic1
      - name: Package and verify Linux service
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/build-cli-archive.ts --platform linux --arch "$ARCH" --version "$VERSION"
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VERSION-linux-$ARCH.tar.gz" --expect-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cli-${{ matrix.arch }}
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [validate, linux_cli]
    if: github.repository == 'hzcheng/t3code'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: hzcheng/t3code
      T3CODE_DESKTOP_VERSION: ${{ needs.validate.outputs.version }}
      T3CODE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Configure public Connect defaults
        run: cp .env.example .env
      - name: Build macOS arm64
        run: vp run dist:desktop:dmg:arm64
      - name: Verify packaged app signatures
        run: |
          shopt -s nullglob
          dmgs=(release/*-arm64.dmg)
          zips=(release/*-arm64.zip)
          [[ ${#dmgs[@]} -eq 1 && ${#zips[@]} -eq 1 ]]
          verify_app() {
            local apps=("$1"/*.app)
            [[ ${#apps[@]} -eq 1 ]]
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          }
          mountpoint=$(mktemp -d)
          hdiutil verify "${dmgs[0]}"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${dmgs[0]}"
          trap 'hdiutil detach "$mountpoint"' EXIT
          verify_app "$mountpoint"
          unpacked=$(mktemp -d)
          ditto -x -k "${zips[0]}" "$unpacked"
          verify_app "$unpacked"
      - name: Download verified Linux services
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-cli-*
          merge-multiple: true
          path: release
      - name: Generate service checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: release
        run: |
          shasum -a 256 "t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-linux-arm64.tar.gz" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' 'macOS Apple Silicon (arm64) build with matching Linux x64 and arm64 SSH service archives.' '' \
            'This build is not Developer ID signed or notarized. macOS may require manual approval to open it. Automatic installation of updates is not guaranteed for unsigned builds.' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --draft --prerelease --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/*-arm64.dmg release/*-arm64.dmg.blockmap \
            release/*-arm64.zip release/*-arm64.zip.blockmap release/*-mac.yml \
            release/t3-*-linux-*.tar.gz release/SHA256SUMS
          gh release edit "$TAG" --draft=false
